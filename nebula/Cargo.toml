[package]
name = "nebula"
version = "0.1.0"
edition = "2024"

[lib]
name = "nebula"
crate-type = ["cdylib"]

[dependencies]
raw-window-handle = "0.6"
wgpu = "30.0.0"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
